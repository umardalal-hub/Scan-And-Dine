<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Scan & Dine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-nav="cart">

  <div class="loader-overlay">
    <div class="loader-mark">S&D</div>
    <p>Fetching your cart…</p>
  </div>

  <div class="app-shell">
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>

    <header class="topbar">
      <a href="index.html" class="icon-btn" aria-label="Back to home">←</a>
      <div class="brand-name">Your Cart</div>
      <button class="icon-btn theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <div class="page-header">
      <div class="crumb">Table <span class="js-table-number">01</span></div>
      <h1>🛒 Your Order</h1>
      <p>Review your items before sending them to the kitchen.</p>
    </div>

    <div id="cartList" class="item-list"></div>

    <div id="cartSummarySection">
      <div class="section-title">Cooking Instructions</div>
      <div class="instructions-box card">
        <textarea id="instructionsInput" class="field" rows="3" placeholder="e.g. Less spicy, no onion, allergic to peanuts…"></textarea>
      </div>

      <div class="section-title">Coupon Code</div>
      <div class="coupon-box card">
        <div class="coupon-row">
          <input id="couponInput" class="field" type="text" placeholder="Try SND10 or WELCOME50">
          <button id="applyCouponBtn" class="btn btn-secondary btn-sm">Apply</button>
        </div>
      </div>

      <div class="section-title">Bill Summary</div>
      <div id="billSummary" class="bill-summary"></div>

      <div class="action-row" style="padding-top:0;">
        <button id="clearCartBtn" class="btn btn-secondary btn-block">Clear Cart</button>
      </div>
      <div class="sticky-cta">
        <button id="placeOrderBtn" class="btn btn-primary btn-block">Place Order 🎉</button>
      </div>
    </div>

    <footer class="app-footer">
      <div class="f-logo">Scan & Dine</div>
      <small>Made with ❤️ for a smarter dining experience · College Mini Project</small>
    </footer>
  </div>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="index.html" class="nav-item" data-page="home"><span class="nav-ic">🏠</span>Home</a>
      <a href="veg-category.html" class="nav-item" data-page="veg"><span class="nav-ic">🥦</span>Veg</a>
      <a href="nonveg-category.html" class="nav-item" data-page="nonveg"><span class="nav-ic">🍗</span>Non-Veg</a>
      <a href="drinks.html" class="nav-item" data-page="drinks"><span class="nav-ic">🥤</span>Drinks</a>
      <a href="cart.html" class="nav-item" data-page="cart"><span class="nav-ic">🛒</span>Cart</a>
    </div>
  </nav>

  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
